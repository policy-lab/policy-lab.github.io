:root{--navy:#01354A;--navy2:#012030;--blue:#08B0EE;--green:#98C43B;--paper:#F7F5EF;--ink:#1A1A1C;--mute:#4A4A50;

html{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--navy);color:#fff;font-family:var(--sans);line-height:1.55;overflow-x:hidden}
.hidden{display:none!important}
.sc-wrap{max-width:1320px;margin:0 auto;padding:56px 48px}
.sc-brand{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:56px}

.sc-brand a.sc-link{font-family:var(--sec);font-size:13px;color:rgba(255,255,255,.75);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:2px;transition:color .2s,border-color .2s}
.sc-brand a.sc-link:hover{color:var(--green);border-color:var(--green)}
.sc-tag{font-family:var(--sec);font-size:15px;font-weight:700;color:var(--blue);margin:0 0 14px}
.staticrypt-title{font-family:var(--sans);font-weight:700;font-size:clamp(32px,4.4vw,50px);line-height:1.12;letter-spacing:-.01em;margin:0 0 16px;max-width:900px}
.sc-sub{font-size:16px;color:rgba(255,255,255,.85);max-width:620px;line-height:1.65;margin:0 0 36px}
.sc-form{background:#fff;color:var(--ink);max-width:440px;padding:28px 28px 24px;border-top:3px solid var(--blue)}
.sc-label{display:block;font-family:var(--sec);font-size:13px;font-weight:700;color:var(--mute);margin-bottom:10px}
.staticrypt-password-container{position:relative}
#staticrypt-password{width:100%;font-family:var(--sec);font-size:16px;padding:12px 44px 12px 14px;border:1px solid #cfd5db;border-radius:0;color:var(--ink);background:#fff}
#staticrypt-password:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.staticrypt-toggle-password-visibility{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;cursor:pointer;opacity:.45}
.staticrypt-remember{display:flex;align-items:center;gap:8px;font-family:var(--sec);font-size:13px;color:var(--mute);margin:14px 0 0}
.staticrypt-decrypt-button{margin-top:18px;width:100%;font-family:var(--sans);font-weight:600;font-size:14px;padding:13px 18px;border:1px solid var(--navy);border-radius:0;background:var(--navy);color:#fff;cursor:pointer}
.staticrypt-decrypt-button:hover{background:var(--navy2);border-color:var(--navy2)}
.staticrypt-decrypt-button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sc-help{font-family:var(--sec);font-size:13px;color:rgba(255,255,255,.72);margin-top:22px;max-width:440px;line-height:1.55}
.sc-help a{color:#fff}

.staticrypt-spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}

@media (max-width:768px){.sc-wrap{padding:40px 24px}.sc-brand img{height:36px}.sc-brand{margin-bottom:44px}}
@media (prefers-reduced-motion:reduce){.staticrypt-spinner{animation:none}}
